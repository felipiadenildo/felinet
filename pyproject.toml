[project]
name = "felinet"
version = "0.4.0.dev0"
description = "Sistema de monitoramento por visao computacional da colonia de gatos do Campus 2 da USP Sao Carlos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Felipi Adenildo Soares Sousa", email = "felipiadenildo@gmail.com" }
]

dependencies = [
    # Núcleo: CLI, manifestos, tabelas e figuras (roda sem GPU e sem pesos de modelos)
    "numpy>=1.26,<2.0",
    "Pillow>=10.4.0",
    "matplotlib>=3.9.0",
    "typer>=0.12.0",
    "questionary>=2.0",
    "PyYAML>=6.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
# Inferência das Fases II-IV (MegaDetector v6, SpeciesNet, MegaDescriptor).
# Versões exatas da execução da monografia: requirements/ambiente-original.txt
modelos = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "timm>=1.0.0",
    "PytorchWildlife>=1.2.0",
    "speciesnet>=5.0.3",
]
# Experimentos complementares do Cap. 5 (YOLOv8n + CLIP ViT-B/32); usa o torch do extra [modelos].
complementares = [
    "ultralytics>=8.3.0",
    "open-clip-torch>=3.0",
    "umap-learn>=0.5",
]
# Fase I com vídeo e CLAHE (OpenCV sem interface gráfica).
video = [
    "opencv-python-headless>=4.10,<5",
]
dev = [
    "opencv-python-headless>=4.10,<5",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
felinet = "felinet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felinet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    # Typer usa typer.Option(...) como default; eh o padrao oficial da biblioteca.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Workaround de sys.path antes dos imports (necessario para o MegaDetector wrapper).
"src/felinet/pipeline/fase2_deteccao/megadetector.py" = ["E402"]
# Convencao cientifica: mAP (mean Average Precision) e nome canonico em literatura
# de Re-ID/IR (CVPR/TREC). Mantemos o casing original em vez de m_ap_at_k.
"src/felinet/pipeline/fase4_reid/avaliacao.py" = ["N802", "N815"]
"tests/test_fase4_avaliacao.py" = ["N802", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not smoke'"
markers = [
    "smoke: testes que dependem de GPU/modelos pesados",
]
